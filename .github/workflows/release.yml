name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: papuga
  DISPLAY_NAME: Papuga
  SCHEME: papuga
  PROJECT_FILE: papuga.xcodeproj
  APP_BUNDLE_NAME: papuga.app
  ARCHIVE_PATH: build/papuga.xcarchive
  EXPORT_DIR: build/export
  USES_XCODEGEN: "false"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set keychain path
        run: echo "KEYCHAIN_PATH=${{ runner.temp }}/build.keychain-db" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Prepare release metadata
        id: metadata
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=$(git rev-list --count HEAD)

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Invalid tag version '$VERSION'. Expected Xcode-compatible version like 1.3.0."
            exit 1
          fi

          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Build number: $BUILD_NUMBER"

      - name: Validate required secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          for var in APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: ${var}"
              exit 1
            fi
          done

          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "::error::Missing required secret: SPARKLE_EDDSA_PRIVATE_KEY"
            exit 1
          fi

          SPARKLE_KEY_LENGTH=$(printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | tr -d '\r\n' | wc -c | tr -d ' ')
          if [ "$SPARKLE_KEY_LENGTH" -lt 80 ]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY looks invalid. Expected the exported Sparkle EdDSA private key, got ${SPARKLE_KEY_LENGTH} characters."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "$APP_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Generate Xcode project (XcodeGen)
        if: env.USES_XCODEGEN == 'true'
        run: |
          brew install xcodegen
          xcodegen generate --quiet

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_FILE" -scheme "$SCHEME"

      - name: Archive universal app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist ExportOptions.plist

          echo "Architectures:"
          lipo -archs "$EXPORT_DIR/$APP_BUNDLE_NAME/Contents/MacOS/$APP_NAME"

          codesign --verify --deep --strict --verbose=2 "$EXPORT_DIR/$APP_BUNDLE_NAME"

      - name: Notarize and staple
        run: |
          ditto -c -k --keepParent "$EXPORT_DIR/$APP_BUNDLE_NAME" "build/${APP_NAME}-notary.zip"

          xcrun notarytool submit "build/${APP_NAME}-notary.zip" \
            --keychain-profile "$APP_NAME" \
            --keychain "$KEYCHAIN_PATH" \
            --wait 2>&1 | tee /tmp/notarize-output.txt

          # On failure, fetch the log for debugging
          if grep -q "status: Invalid" /tmp/notarize-output.txt; then
            SUBMISSION_ID=$(grep "id:" /tmp/notarize-output.txt | head -1 | awk '{print $2}')
            echo "::group::Notarization log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --keychain-profile "$APP_NAME" \
              --keychain "$KEYCHAIN_PATH" 2>&1 || true
            echo "::endgroup::"
            exit 1
          fi

          xcrun stapler staple "$EXPORT_DIR/$APP_BUNDLE_NAME"
          spctl --assess --type exec --verbose "$EXPORT_DIR/$APP_BUNDLE_NAME"

      - name: Create DMG
        run: |
          brew install create-dmg

          create-dmg \
            --volname "$DISPLAY_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_BUNDLE_NAME" 175 190 \
            --app-drop-link 425 190 \
            "build/${DISPLAY_NAME}-${VERSION}.dmg" \
            "$EXPORT_DIR/"

          shasum -a 256 "build/${DISPLAY_NAME}-${VERSION}.dmg" | awk '{print $1}' > "build/${DISPLAY_NAME}-${VERSION}.sha256"
          cp "build/${DISPLAY_NAME}-${VERSION}.dmg" "build/${DISPLAY_NAME}-latest.dmg"
          shasum -a 256 "build/${DISPLAY_NAME}-latest.dmg" | awk '{print $1}' > "build/${DISPLAY_NAME}-latest.sha256"

      - name: Sign DMG with Sparkle EdDSA
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          DMG_PATH="build/${DISPLAY_NAME}-${VERSION}.dmg"

          # Download Sparkle tools
          SPARKLE_VERSION="2.9.0"
          curl -fSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle_tools
          tar -xf sparkle.tar.xz -C sparkle_tools

          SPARKLE_KEY_FILE="${RUNNER_TEMP}/sparkle_ed25519_private_key"
          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"

          sparkle_tools/bin/sign_update "$DMG_PATH" --ed-key-file "$SPARKLE_KEY_FILE" > /tmp/sign_output.txt 2>&1 || {
            echo "sign_update failed:"
            cat /tmp/sign_output.txt
            exit 1
          }
          SIGN_OUTPUT=$(cat /tmp/sign_output.txt)
          echo "Sparkle signature: $SIGN_OUTPUT"
          {
            echo 'SPARKLE_SIGN_OUTPUT<<SPARKLE_EOF'
            echo "$SIGN_OUTPUT"
            echo 'SPARKLE_EOF'
          } >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            "build/${DISPLAY_NAME}-${VERSION}.dmg"
            "build/${DISPLAY_NAME}-${VERSION}.sha256"
            "build/${DISPLAY_NAME}-latest.dmg"
            "build/${DISPLAY_NAME}-latest.sha256"
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --title "${APP_NAME} ${VERSION}" \
              --generate-notes \
              --latest
          fi

      - name: Update appcast.xml
        run: |
          DMG_PATH="build/${DISPLAY_NAME}-${VERSION}.dmg"
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${DISPLAY_NAME}-${VERSION}.dmg"

          # Parse edSignature and length from sign_update output
          ED_SIGNATURE=$(echo "$SPARKLE_SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          ED_LENGTH=$(echo "$SPARKLE_SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          if [ -z "$ED_SIGNATURE" ]; then
            echo "::error::Could not parse sparkle:edSignature from sign_update output"
            cat /tmp/sign_output.txt
            exit 1
          fi

          python3 scripts/update_appcast.py \
            --appcast docs/appcast.xml \
            --version "$BUILD_NUMBER" \
            --short-version "$VERSION" \
            --download-url "$DOWNLOAD_URL" \
            --ed-signature "$ED_SIGNATURE" \
            --length "${ED_LENGTH:-$DMG_SIZE}" \
            --minimum-system-version "14.0.0"

          echo "Updated appcast.xml with version ${VERSION}"
          cat docs/appcast.xml

      - name: Commit and push appcast.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/appcast.xml /tmp/appcast.xml
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast.xml docs/appcast.xml
          git add docs/appcast.xml
          if ! git diff --quiet --cached -- docs/appcast.xml; then
            git commit -m "Update appcast.xml for ${GITHUB_REF_NAME}"
            git push origin main
          fi

      - name: Cleanup signing artifacts
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f certificate.p12 "build/${APP_NAME}-notary.zip" "${RUNNER_TEMP}/sparkle_ed25519_private_key"
